name: Publicar versão

# Sempre que o código é enviado para a main com uma versão nova no package.json,
# o GitHub compila o instalador e cria a Release (e a tag) automaticamente.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ler versão
        id: v
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verificar se a Release já existe
        id: ex
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then echo "existe=1" >> "$GITHUB_OUTPUT"; else echo "existe=0" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ex.outputs.existe == '0'
        run: npm ci
      - if: steps.ex.outputs.existe == '0'
        run: npx electron-builder --win --publish never
      - if: steps.ex.outputs.existe == '0'
        name: Criar Release e anexar o instalador
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.v.outputs.tag }}" --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --generate-notes
          gh release upload "${{ steps.v.outputs.tag }}" dist/*Setup*.exe --clobber
